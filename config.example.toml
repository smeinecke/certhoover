[certstream]
url = "wss://certstream.calidog.io/"

[clickhouse]
# Uses the ClickHouse HTTP interface (default 8123, not the native TCP port 9000)
host = "localhost"
port = 8123
user = "default"
password = ""
database = "default"

[service]
# Enable systemd watchdog notifications (requires libsystemd-dev and WatchdogSec in service file)
enable_systemd_notify = true
batch_size = 1000
max_batch_age_secs = 5
logging_level = "info"
